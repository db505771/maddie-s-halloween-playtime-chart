<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orange Playtime Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      background: transparent !important;
      overflow-x: hidden;
    }
    body {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      -webkit-tap-highlight-color: transparent;
    }
    .totals {
      padding: 20px 10px 10px;
    }
    .totals h2 {
      margin: 0;
      color: #ffb16b;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -0.4px;
    }
    .totals p {
      margin: 6px 0 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 16px;
      font-weight: 500;
    }
    #chart-container {
      position: relative;
      width: 90%;
      max-width: 400px;
      height: 190px;
      margin: 0 auto;
    }
    #chart {
      display: block;
      width: 100%;
      height: 100%;
    }
    .swipe-hint {
      margin: 4px 0 12px;
      color: rgba(255, 190, 135, 0.72);
      font-size: 11px;
      letter-spacing: 0.3px;
    }
    .error {
      color: #ffb16b;
      font-size: 13px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="totals">
    <h2 id="chart-title">Total Time</h2>
    <p id="total-time">Loading...</p>
  </div>
  <div id="chart-container">
    <canvas id="chart"></canvas>
  </div>
  <p class="swipe-hint"></p>
  <p id="error-message" class="error" hidden></p>
  <script>
    const csvUrl =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vRo-SarpignS39lDSaIGsV13WyUJOURcyVaRP_mEqY6XfBxby9WA_XCf5AhXi8OcwHDiP4FLqBwMGKw/pub?output=csv";
    let chartMode = 0;
    let chart = null;
    let trackerRows = [];
    const ORANGE = "#ff9b45";
    const LIGHT_ORANGE = "#ffd0a0";
    function formatTime(minutes) {
      const mins = Math.max(0, Math.floor(minutes));
      const hours = Math.floor(mins / 60);
      const remainder = mins % 60;
      return `${hours}h ${remainder}m`;
    }
    /*
      CSV parser that handles quoted fields and commas.
    */
    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (char === '"' && quoted && next === '"') {
          field += '"';
          i++;
        } else if (char === '"') {
          quoted = !quoted;
        } else if (char === "," && !quoted) {
          row.push(field);
          field = "";
        } else if ((char === "\n" || char === "\r") && !quoted) {
          if (char === "\r" && next === "\n") i++;
          row.push(field);
          if (row.some(value => value.trim() !== "")) {
            rows.push(row);
          }
          row = [];
          field = "";
        } else {
          field += char;
        }
      }
      if (field.length || row.length) {
        row.push(field);
        if (row.some(value => value.trim() !== "")) {
          rows.push(row);
        }
      }
      return rows;
    }
    async function fetchCSV(url) {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error("Could not load the Google Sheets data.");
      }
      const text = await response.text();
      const rows = parseCSV(text);
      return rows.slice(1);
    }
    function localDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }
    function parseDate(value) {
      if (!value) return null;
      const input = String(value).trim();
      // Handle dates formatted as YYYY-MM-DD without UTC shifting.
      const match = input.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (match) {
        const date = new Date(
          Number(match[1]),
          Number(match[2]) - 1,
          Number(match[3])
        );
        if (!Number.isNaN(date.getTime())) return date;
      }
      const date = new Date(input);
      return Number.isNaN(date.getTime()) ? null : date;
    }
    function getLast7Days() {
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const date = new Date();
        date.setDate(date.getDate() - i);
        date.setHours(0, 0, 0, 0);
        days.push(date);
      }
      return days;
    }
    function getRowsForDateRange(rows, start, end) {
      const totals = {};
      rows.forEach(row => {
        const date = parseDate(row[0]);
        const minutes = Number.parseInt(row[4], 10);
        if (!date || !Number.isFinite(minutes)) return;
        if (date < start || date >= end) return;
        const key = localDateKey(date);
        totals[key] = (totals[key] || 0) + Math.max(0, minutes);
      });
      return totals;
    }
    function getLifetimeTotal(rows) {
      /*
        Column C = total hours
        Column D = total minutes
        The latest valid total is used for the headline.
      */
      for (let i = rows.length - 1; i >= 0; i--) {
        const hours = Number.parseInt(rows[i][2], 10);
        const minutes = Number.parseInt(rows[i][3], 10);
        if (Number.isFinite(hours) && Number.isFinite(minutes)) {
          return Math.max(0, hours * 60 + minutes);
        }
      }
      return 0;
    }
    function makeChartData(rows) {
      const now = new Date();
      let labels = [];
      let values = [];
      let headlineMinutes = 0;
      let title = "";
      if (chartMode === 0) {
        title = "Total Time";
        headlineMinutes = getLifetimeTotal(rows);
        const days = getLast7Days();
        const start = new Date(days[0]);
        const end = new Date(days[6]);
        end.setDate(end.getDate() + 1);
        const totals = getRowsForDateRange(rows, start, end);
        labels = days.map(date =>
          date.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
          })
        );
        values = days.map(date => totals[localDateKey(date)] || 0);
      } else if (chartMode === 1) {
        title = "Monthly Playtime";
        const months = [];
        for (let i = 0; i <= now.getMonth(); i++) {
          months.push(new Date(now.getFullYear(), i, 1));
        }
        const start = new Date(now.getFullYear(), 0, 1);
        const end = new Date(now.getFullYear() + 1, 0, 1);
        const monthTotals = Array(12).fill(0);
        rows.forEach(row => {
          const date = parseDate(row[0]);
          const minutes = Number.parseInt(row[4], 10);
          if (
            date &&
            Number.isFinite(minutes) &&
            date >= start &&
            date < end
          ) {
            monthTotals[date.getMonth()] += Math.max(0, minutes);
          }
        });
        labels = months.map(date =>
          date.toLocaleDateString("en-US", { month: "short" })
        );
        values = months.map(date => monthTotals[date.getMonth()]);
        headlineMinutes = monthTotals[now.getMonth()];
      } else {
        title = "Weekly Time";
        const days = getLast7Days();
        const start = new Date(days[0]);
        const end = new Date(days[6]);
        end.setDate(end.getDate() + 1);
        const totals = getRowsForDateRange(rows, start, end);
        labels = days.map(date =>
          date.toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
          })
        );
        values = days.map(date => totals[localDateKey(date)] || 0);
        headlineMinutes = values.reduce((sum, value) => sum + value, 0);
      }
      return { labels, values, headlineMinutes, title };
    }
    function renderChart(rows) {
      const result = makeChartData(rows);
      document.getElementById("chart-title").textContent = result.title;
      document.getElementById("total-time").textContent =
        formatTime(result.headlineMinutes);
      const canvas = document.getElementById("chart");
      const ctx = canvas.getContext("2d");
      if (chart) {
        chart.destroy();
      }
      /*
        Warm orange gradient for the bars.
      */
      const gradient = ctx.createLinearGradient(0, 0, 0, 190);
      gradient.addColorStop(0, "rgba(255, 184, 112, 0.98)");
      gradient.addColorStop(0.55, "rgba(255, 133, 45, 0.90)");
      gradient.addColorStop(1, "rgba(224, 79, 19, 0.65)");
      chart = new Chart(ctx, {
        type: "bar",
        data: {
          labels: result.labels,
          datasets: [{
            label: "Minutes Played",
            data: result.values,
            backgroundColor: gradient,
            hoverBackgroundColor: "#ffc18a",
            borderColor: "rgba(255, 190, 125, 0.95)",
            borderWidth: 1,
            borderRadius: 7,
            borderSkipped: false,
            barPercentage: 0.72,
            categoryPercentage: 0.78
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: {
            duration: 350
          },
          interaction: {
            intersect: false,
            mode: "index"
          },
          plugins: {
            legend: {
              display: false
            },
            tooltip: {
              backgroundColor: "rgba(25, 13, 8, 0.94)",
              titleColor: "#ffd0a0",
              bodyColor: "#ffffff",
              borderColor: "rgba(255, 155, 69, 0.6)",
              borderWidth: 1,
              padding: 10,
              callbacks: {
                label: context => {
                  return " " + formatTime(context.raw) + " played";
                }
              }
            }
          },
          layout: {
            padding: {
              top: 8,
              bottom: 4
            }
          },
          scales: {
            x: {
              border: {
                display: false
              },
              ticks: {
                color: "rgba(255, 235, 218, 0.85)",
                font: {
                  size: 10
                },
                maxRotation: 0,
                autoSkip: true
              },
              grid: {
                display: false,
                drawTicks: false
              }
            },
            y: {
              beginAtZero: true,
              border: {
                display: false
              },
              ticks: {
                display: false,
                precision: 0
              },
              grid: {
                display: false
              }
            }
          }
        }
      });
    }
    function setupSwipe() {
      let startX = 0;
      let startY = 0;
      document.body.addEventListener("touchstart", event => {
        if (!event.touches.length) return;
        startX = event.touches[0].clientX;
        startY = event.touches[0].clientY;
      }, { passive: true });
      document.body.addEventListener("touchend", event => {
        if (!event.changedTouches.length) return;
        const deltaX = event.changedTouches[0].clientX - startX;
        const deltaY = event.changedTouches[0].clientY - startY;
        // Only change views on a clear horizontal swipe.
        if (Math.abs(deltaX) > 55 && Math.abs(deltaX) > Math.abs(deltaY)) {
          if (deltaX < 0) {
            chartMode = (chartMode + 1) % 3;
          } else {
            chartMode = (chartMode + 2) % 3;
          }
          renderChart(trackerRows);
        }
      }, { passive: true });
    }
    async function init() {
      const error = document.getElementById("error-message");
      try {
        if (typeof Chart === "undefined") {
          throw new Error("The chart library could not load.");
        }
        trackerRows = await fetchCSV(csvUrl);
        setupSwipe();
        renderChart(trackerRows);
      } catch (err) {
        document.getElementById("total-time").textContent = "Unavailable";
        error.textContent =
          "Couldn't load playtime data. Check your published Google Sheet and internet connection.";
        error.hidden = false;
        console.error(err);
      }
    }
    init();
  </script>
</body>
</html>
